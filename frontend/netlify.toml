[build]
  command = "npm run build"
  publish = "dist"

# SPA redirect — all routes serve index.html so React Router handles navigation.
# Without this, any direct URL like /dashboard will return 404 on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Security headers for Netlify CDN
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
